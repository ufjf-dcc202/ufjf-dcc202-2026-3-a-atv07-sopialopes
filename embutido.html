<!DOCTYPE html>
<html lang="portugues">
<head>
    <meta charset="UTF-8">
    <meta name="DCC202 CSS Em Linhas" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Em Linha</title>
    <style>
        em {
        color: orange;
        text-decoration: underline;
        }
        code {
        color: lime; 
        text-decoration: dotted;
        }
        body > main > ol > li:nth-child(1) > code {
            color: white;
            background-color: black;
        }
    </style>
</head>

<body>
    <main> 
        <h1>DCC202 CSS Em Linha</h1>
        <p>O estilo <em style > em linha</em> 
        é aplicado diretamente no elmento via atributo <code> style </code> </p>
    </main>
</body>
</html>
